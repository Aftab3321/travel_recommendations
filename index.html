<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Blooms</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
    <header class="text-bg-dark py-3 mb-0">
        <div class="container_fluid px-5 d-flex flex-wrap align-items-center justify-content-center justify-content-md-between">
            <div class="col-md-3 mb-2 mb-md-0">
              <a href="/" class="d-inline-flex gap-3 align-items-center link-body-emphasis text-decoration-none">
                <img src="./assets/images/site_logo.png" height="45" alt="Site Logo">
                <p class="fs-5 text-light mb-0">Travel Booms</p>
              </a>
            </div>
      
            <ul class="nav col-12 col-md-auto mb-2 justify-content-center mb-md-0">
              <li><a href="/" class="nav-link px-2 text-light active">Home</a></li>
              <li><a href="/about.html" class="nav-link px-2 text-light">About Us</a></li>
              <li><a href="/contact.html" class="nav-link px-2 text-light">Contact Us</a></li>
            </ul>
      
            <div class="col-md-5 text-end">
                <div class="search-container">
                    <div class="search d-flex gap-3 align-items-center justify-content-between">
                        <div class="search_input_div d-flex gap-2 align-items-center flex-fill">
                            <div id="tagsContainer" class="tags-container flex-fill">

                                <input type="text" id="searchInputHomePage" class="searchInput flex-fill" placeholder="Enter a Destination or Keyword" id="searchInput">
                                <i class="bi bi-search text-dark"></i>
                            </div>
                        </div>
                        <div class="search_buttons">
                            <button type="button" class="btn me-2">Search</button>
                            <button type="button" class="btn">Clear</button>
                        </div>
                    </div>
                    <div id="dropdownResults" class="dropdown-menu"></div>
                </div>
            </div>
        </div>
    </header>
    <main>
        <section id="main-section">
            <div class="main-section-wrapper">
                <div class="d-flex align-items-center gap-5">
                    <div class="socials">
                        <div class="line">
                            <!-- <hr> -->
                        </div>
                        <div class="icons d-flex flex-column gap-4">
                            <i class="bi bi-twitter"></i>
                            <i class="bi bi-facebook"></i>
                            <i class="bi bi-instagram"></i>
                            <i class="bi bi-youtube"></i>
                        </div>
                    </div>
                    <div class="content flex-fill">
                        <div class="d-flex gap-3 flex-column">
                            <h1>Explore Dream Destination</h1>
                            <p class="text-light">Lorem ipsum dolor, sit amet consectetur adipisicing elit. Harum ut consectetur voluptates rem nam, blanditiis similique consequuntur inventore nisi eum dolorem dignissimos, libero quo neque aut, quasi illum velit sit.</p>
                            <button class="btn hero-button">Book Now</button>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <section id="posts">
            <div class="container">
                
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="./travel_recommendation.js"></script>
</body>
</html>
