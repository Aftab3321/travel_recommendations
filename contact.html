<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Blooms</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/assets/styles.css">
    <style>
        /* Hero Section Styles */
        .content {
            width: 100%;
        }
        .hero {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 50px;
            /* background: #f9f9f9; */
            min-height: 60vh;
        }

        .hero-text {
            width: 75%;
            font-size: 32px;
            color: #fff;
            font-weight: bold;
        }
        .hero-text h1 {
            font-size: 62px !important;
            width: 100% !important;
        }
        .hero-text p {
            font-size: 22px !important;
        }

        .hero-form {
            width: 100%;
        }

        .hero-form form {
            width: 65%;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 2px 10px rgba(0, 0, 0, 0.1);
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }

        input::placeholder, textarea::placeholder {
            color: #aaa;
        }

        button {
            width: 100% !important;
            padding: 12px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #0056b3;
        }

        .message {
            margin-top: 10px;
            font-weight: bold;
        }

        .success {
            color: green;
        }

        .error {
            color: red;
        }
    </style>
</head>
<body>
    <header class="text-bg-dark py-3 mb-0">
        <div class="container_fluid px-5 d-flex flex-wrap align-items-center justify-content-center justify-content-md-between">
            <div class="col-md-5 mb-2 mb-md-0">
              <a href="/" class="d-inline-flex gap-3 align-items-center link-body-emphasis text-decoration-none">
                <img src="./assets/images/site_logo.png" height="45" alt="Site Logo">
                <p class="fs-5 text-light mb-0">Travel Booms</p>
              </a>
            </div>
      
            <ul class="nav flex-fill mb-2 justify-content-start mb-md-0">
              <li><a href="/" class="nav-link px-2 text-light">Home</a></li>
              <li><a href="/about.html" class="nav-link px-2 active text-light">About Us</a></li>
              <li><a href="/contact.html" class="nav-link px-2 text-light">Contact Us</a></li>
            </ul>
      
            
        </div>
    </header>
    <main>
        <section id="main-section" class="contact_page">
            <div class="main-section-wrapper">
                <div class="d-flex align-items-center gap-5 flex-fill">
                    <div class="socials">
                        <div class="line">
                            <!-- <hr> -->
                        </div>
                        <div class="icons d-flex flex-column gap-4">
                            <i class="bi bi-twitter"></i>
                            <i class="bi bi-facebook"></i>
                            <i class="bi bi-instagram"></i>
                            <i class="bi bi-youtube"></i>
                        </div>
                    </div>
                    <div class="content">
                        <div class="hero">
                            <div class="hero-text">
                                <h1>Contact Us</h1>
                                <p>have any questions? Feel Free to reach out!</p>
                            </div>
                            <div class="hero-form flex-fill">
                                <form id="contactForm">
                                    <div class="form-group">
                                        <label for="name">Name</label>
                                        <input type="text" id="name" placeholder="e.g., John Doe">
                                    </div>
                    
                                    <div class="form-group">
                                        <label for="email">Email</label>
                                        <input type="email" id="email" placeholder="e.g., john@example.com">
                                    </div>
                    
                                    <div class="form-group">
                                        <label for="message">Message</label>
                                        <textarea id="message" rows="4" placeholder="Write your message here..."></textarea>
                                    </div>

                                    <div class="submitButton w-100">
                                        <button type="submit">Send Message</button>
                                    </div>
                    
                                    <p class="message" id="formMessage"></p>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script>
        document.getElementById("contactForm").addEventListener("submit", function(event) {
            event.preventDefault(); // Prevent form submission

            let name = document.getElementById("name").value.trim();
            let email = document.getElementById("email").value.trim();
            let message = document.getElementById("message").value.trim();
            let messageBox = document.getElementById("formMessage");

            messageBox.textContent = "";
            messageBox.classList.remove("error", "success");

            let errors = [];

            // Validate Name
            if (name === "") {
                errors.push("Name is required.");
            }

            // Validate Email
            if (email === "") {
                errors.push("Email is required.");
            } else if (!/\S+@\S+\.\S+/.test(email)) {
                errors.push("Invalid email format.");
            }

            // Validate Message
            if (message === "") {
                errors.push("Message cannot be empty.");
            }

            if (errors.length > 0) {
                console.error("Form Errors:", errors);
                messageBox.textContent = errors.join(" ");
                messageBox.classList.add("error");
            } else {
                console.log("Form submitted successfully!");
                messageBox.textContent = "Thank you for contacting us! We'll get in touch with you as soon as possible.";
                messageBox.classList.add("success");

                // Optionally, clear the form fields
                document.getElementById("contactForm").reset();
            }
        });
    </script>
</body>
</html>
